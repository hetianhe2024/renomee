site_name: Renomee AI 文档
site_url: https://renomeeai.readthedocs.io/en/latest/
site_description: Renomee - AI智能文件重命名工具使用指南
site_author: Renomee Team

# 仓库信息
repo_url: https://github.com/hetianhe2024/renomee
repo_name: hetianhe2024/renomee
edit_uri: edit/main/docs/

# 主题配置
theme:
  name: material
  custom_dir: docs/.overrides
  palette:
    # 浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    # 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.instant      # 即时加载
    - navigation.tracking     # 跟踪锚点
    - navigation.tabs         # 顶部导航 Tab（4 个内容域）
    - navigation.sections     # 侧边栏分组标题
    - navigation.indexes      # 分组首页支持
    - navigation.top          # 返回顶部按钮
    - search.suggest          # 搜索建议
    - search.highlight        # 搜索高亮
    - content.code.copy       # 代码复制按钮
  icon:
    repo: fontawesome/brands/github

# 导航结构
# 顶部 4 个 Tab 对应 4 个内容域，侧边栏在各自 Tab 内按任务分组
nav:

  # Tab 1：学习 —— 新用户入门 + 核心功能说明
  - 学习:
      - 快速入门:
          - 产品简介: index.md
          - 安装说明: guide/installation.md
          - 快速上手: quickstart.md
      - 使用指南:
          - 基础操作: guide/basic-usage.md
          - AI 模式与高级功能: guide/advanced-features.md

  # Tab 2：教程 —— 按任务场景分组，内容可持续扩充
  - 教程:
      - how-to/index.md
      - PDF 与文档:
          - 根据标题重命名 PDF: how-to/rename-pdf-by-title.md
          - 按内容智能重命名文件: how-to/rename-files-by-content.md
          - 扫描版 PDF 自动重命名: how-to/rename-scanned-pdfs-automatically.md
          - 扫描 PDF 按内容重命名（OCR）: recipes/rename-scanned-pdfs-by-content.md
      - 办公与财务:
          - 发票按供应商和日期重命名: recipes/rename-invoices-by-vendor-date.md
          - 合同按甲乙方和日期重命名: recipes/rename-contracts-by-party-date.md
          - 学术论文按标题和作者重命名: recipes/rename-research-papers-by-title-author.md
      - 照片与媒体:
          - 按 EXIF 批量重命名照片: how-to/batch-rename-photos-by-exif.md
          - 照片按 EXIF 日期批量重命名: recipes/rename-photos-by-exif-date.md
          - MP3 按 ID3 标签重命名: recipes/rename-mp3-by-id3-tag.md

  # Tab 3：参考 —— 查规格、查对比，内容扩充时按文件类型加页面
  - 参考:
      - 支持的文件类型:
          - PDF 文件: file-types/pdf/index.md
      - 工具对比: alternatives/index.md

  # Tab 4：帮助 —— 固定入口，不随内容扩充而增长
  - 帮助:
      - 常见问题: faq.md
      - 隐私与数据安全: about/privacy.md
      - 更新日志: about/changelog.md
      - 相关讨论: about/related-threads.md

# Markdown 扩展
markdown_extensions:
  - admonition                # 提示框
  - pymdownx.details          # 可折叠提示框
  - pymdownx.superfences      # 代码块增强
  - pymdownx.highlight:       # 代码高亮
      anchor_linenums: true
  - pymdownx.inlinehilite     # 行内代码高亮
  - pymdownx.snippets         # 代码片段
  - pymdownx.tabbed:          # 标签页
      alternate_style: true
  - tables                    # 表格支持
  - toc:                      # 目录
      permalink: true
      title: 目录
  - attr_list                 # 属性列表
  - md_in_html                # HTML 中的 Markdown
  - pymdownx.emoji:           # Emoji 支持
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# 额外配置
extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://renomeeai.com
      name: 官方网站
    - icon: fontawesome/brands/github
      link: https://github.com/hetianhe2024/renomee
      name: GitHub
  analytics:
    provider: google
    property: G-XXXXXXXXXX  # 替换为您的 Google Analytics ID
  # SEO 优化
  generator: false  # 移除 MkDocs 生成器标签

# 排除文件（不发布）
exclude_docs: |
  # 内部文档
  README_NEW_STRUCTURE.md
  SEO_CONTENT_PLAN.md
  assets/README_SCREENSHOTS.md
  .templates/
  
  # Thin content 页面（内容不足300字的占位页）
  file-types/images/index.md
  file-types/documents/index.md
  file-types/audio/index.md
  file-types/video/index.md
  use-cases/downloads/index.md
  use-cases/business/index.md
  use-cases/media/index.md
  
  # 英文版对应页面
  en/file-types/images/index.md
  en/file-types/documents/index.md
  en/file-types/audio/index.md
  en/file-types/video/index.md
  en/use-cases/downloads/index.md
  en/use-cases/business/index.md
  en/use-cases/media/index.md

