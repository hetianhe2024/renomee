site_name: Renomee AI 文档
site_url: https://renomeeai.readthedocs.io/en/latest/
site_description: Renomee - AI智能文件重命名工具使用指南
site_author: Renomee Team

# 仓库信息
repo_url: https://github.com/hetianhe2024/renomee
repo_name: hetianhe2024/renomee
edit_uri: edit/main/docs/

# 主题配置
theme:
  name: material
  custom_dir: docs/.overrides
  palette:
    # 浅色模式 — 白色顶栏，参考 Base44 风格
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    # 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: grey
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.instant        # 即时加载
    - navigation.tracking       # 跟踪锚点
    - navigation.tabs           # 顶部 Tab 栏
    - navigation.tabs.sticky    # 双层导航始终固定，不随滚动隐藏
    - navigation.sections       # 侧边栏分组标题
    - navigation.indexes        # 分组支持 index 页
    - navigation.top            # 返回顶部按钮
    - search.suggest            # 搜索建议
    - search.highlight          # 搜索高亮
    - content.code.copy         # 代码复制按钮
  icon:
    repo: fontawesome/brands/github

# 自定义样式
extra_css:
  - stylesheets/extra.css

# 导航结构
# 顶部 3 个 Tab，侧边栏按用户任务分组（不暴露 Guide/How-to/Recipe 概念）
nav:

  # ── Tab 1：使用指南 ── 所有"学"与"做"的内容
  - 使用指南:
      - 开始使用:
          - 产品简介: index.md
          - 安装 Renomee: guide/installation.md
          - 快速上手: quickstart.md
          - 基础操作: guide/basic-usage.md
          - AI 识别与 OCR 能力: guide/advanced-features.md
      - PDF 与文档:
          - 根据标题重命名 PDF: how-to/rename-pdf-by-title.md
          - 自动重命名扫描版 PDF: how-to/rename-scanned-pdfs-automatically.md
          - 根据内容重命名文件: how-to/rename-files-by-content.md
          - 扫描 PDF 按内容命名（OCR）: recipes/rename-scanned-pdfs-by-content.md
          - 发票按供应商和日期命名: recipes/rename-invoices-by-vendor-date.md
          - 合同按甲乙方和日期命名: recipes/rename-contracts-by-party-date.md
          - 论文按标题和作者命名: recipes/rename-research-papers-by-title-author.md
      - 照片与图片:
          - 照片按 EXIF 批量重命名: how-to/batch-rename-photos-by-exif.md
          - EXIF 日期完整操作步骤: recipes/rename-photos-by-exif-date.md
      - 音频:
          - MP3 按 ID3 标签命名: recipes/rename-mp3-by-id3-tag.md

  # ── Tab 2：参考资料 ── 纯查阅：格式规格、限制、安全、工具对比
  - 参考资料:
      - 支持的格式:
          - 格式与能力总览: file-types/index.md
          - PDF 文件: file-types/pdf/index.md
      - 隐私与数据安全: about/privacy.md
      - 工具对比: alternatives/index.md

  # ── Tab 3：帮助 ── 固定入口，不随内容扩充增长
  - 帮助:
      - 常见问题: faq.md
      - 更新日志: about/changelog.md
      - 相关讨论: about/related-threads.md

# Markdown 扩展
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      title: 目录
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# 额外配置
extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://renomeeai.com
      name: 官方网站
    - icon: fontawesome/brands/github
      link: https://github.com/hetianhe2024/renomee
      name: GitHub
  analytics:
    provider: google
    property: G-XXXXXXXXXX  # 替换为您的 Google Analytics ID
  generator: false

# 排除文件（不发布）
exclude_docs: |
  # 内部文档
  README_NEW_STRUCTURE.md
  SEO_CONTENT_PLAN.md
  assets/README_SCREENSHOTS.md
  .templates/

  # 不在导航中的 index 汇总页（由新导航结构取代）
  how-to/index.md
  recipes/index.md
  en/how-to/index.md
  en/recipes/index.md

  # 整个 use-cases 目录（已从导航移除）
  use-cases/index.md
  use-cases/research/index.md
  use-cases/downloads/index.md
  use-cases/business/index.md
  use-cases/media/index.md
  en/use-cases/index.md
  en/use-cases/research/index.md
  en/use-cases/downloads/index.md
  en/use-cases/business/index.md
  en/use-cases/media/index.md

  # Thin content 占位页（内容不足，尚未完成）
  file-types/images/index.md
  file-types/documents/index.md
  file-types/audio/index.md
  file-types/video/index.md
  en/file-types/images/index.md
  en/file-types/documents/index.md
  en/file-types/audio/index.md
  en/file-types/video/index.md

